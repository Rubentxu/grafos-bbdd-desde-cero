rica ≈ d·λ₂ es contenido del capítulo: testeada monótona y < 1); arranque desde el propio teleport. PPR BIEN SEPARADO del global para GraphRAG cap 51: enum Teleport { Uniform, Personalized(pesos) } — personalizado/Personalized valida pesos ≥ 0 (negativo señalado), masa > 0 y nodos existentes; MISMO núcleo iteracion_de_potencia para ambos (cero duplicación, una costura). Resultados tipados con transparencia: PageRankResult { damping, converged, delta, history, stats } + score(id)/ranking()/total_mass(); CentralidadStats { bfs_runs, edges_scanned, iterations } = la sección 'coste computacional' del guion, medible. Errores CentralidadError (6 variantes) con Display+Error. Sorpresa pedagógica testeada en demo_graph: el self-loop de Dani + cuota colgante = trampa de acumulación (0.386, top del ranking). 28 tests (tests_centralidad) + 6 doctests: soluciones a mano (ciclos compartidos 0.4865/0.2568; cadena con dangling 0.1844/0.3412/0.4744; PPR dos componentes a=0.15/(1-0.85²) con masa 0 fuera del mundo), damping extremos (d→0 ≈ uniforme; d→1 más iteraciones; bordes y NaN rechazados), masa por componente ∝ tamaño, multigrafo roba-masa, huecos tras delete, Brandes camino/estrella/diamante/paralelas, eigenvector estrella-hojas-a-cero y no-converge-periódico-vs-PageRank-sí, PPR semillas ponderadas 3:1, errores Display/Error."
