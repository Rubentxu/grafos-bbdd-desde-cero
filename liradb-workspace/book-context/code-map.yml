  - chapter: "vol2-cap-25"
    title: "Comunidades y agrupaciones (Louvain simplificado)"
    crates:
      - vol2-liradb
    modules: [cap25_comunidades]
    snippets: []
    notes: "Parte V (algoritmos sobre el grafo persistente), cap 4. El cap 24 rankeó NODOS; éste PARTICIONA el grafo. Las CUATRO familias del guion (brief §cap 25: componentes, label propagation, modularidad, Louvain simplificado) sobre &dyn GraphStore: (1) componentes_conexas = el caso límite (alcanzabilidad pura, BFS sobre vista simétrica, numeradas por menor miembro); (2) label_propagation = la heurística SIN métrica que MOTIVA Louvain: votos ponderados por peso de arista, barrido asíncrono por id ascendente, empates → se CONSERVA la propia etiqueta si empata con la máxima y si no la MENOR (determinismo total, sin aleatoriedad) — su límite GOTEA por los puentes con pesos uniformes (testeado: dos K3 con puente → 1 comunidad en LPA vs 2 en Louvain sobre el MISMO grafo; romper empates con pesos lo arregla); (3) modularidad = Q_γ de Newman-Girvan como función VERIFICABLE sobre una partición DADA (Σ_c [Σ_in/2m − γ(Σ_tot/2m)²], γ de Reichardt-Bornholdt): trivial Q=0 exacto, nodos ausentes de la partición → singletons, ids de grupo u64 arbitrarios (densificados), UnknownNode señalado; (4) louvain = Blondel 2008 simplificado: fase local greedy (cada nodo al vecino con mayor ΔQ EXACTO por diferencia de términos de comunidad, sólo ΔQ>0 estricto) + AGREGACIÓN (comunidades → supernodos, aristas internas → self-loops, 2m conservado ⇒ la Q de cada nivel es igual en el grafo contraído y en el original, invariante testeada) iterando niveles hasta que una fase no mueva nada. DECISIÓN CLAVE: GrafoPonderado propio (simétrico, pesos de dirigidas SUMADOS al par — store simetrizado a mano suma 2w —, paralelas ACUMULADAS, self-loops separados con convención estándar A_ii=2s contando doble en k_i y 2m) y NO la Proyeccion del cap 24 (ésta es no ponderada y su Both DEDUPLICA pares; además Louvain reconstruye el grafo por nivel: el GrafoPonderado es a la vez proyección inicial y grafo de nivel). Pesos con la semántica ESTRICTA del cap 22 (WeightSource/edge_weight: MissingWeight/InvalidWeight/NonFiniteWeight envueltos en ComunidadesError::Weight con From<PathError>); negativos rechazados EAGER (NegativeWeight con arista señalada). Determinismo TOTAL: nodos por id, candidatos por id de comunidad, empates ΔQ por total_cmp → primero gana, renumeración por menor miembro (dos ejecuciones = resultado idéntico, testeado incluso con orden de inserción invertido). Cota de terminación demostrable: cada nivel con movimientos reduce estrictamente los nodos (el primer movimiento vacía una comunidad singleton) ⇒ niveles ≤ V; max_pasadas por nivel como seguro anti-ruido-f64. JERARQUÍA para GraphRAG cap 51: NivelLouvain { nivel, num_comunidades, modularidad, pasadas, movimientos, asignación de los nodos ORIGINALES (composición) } — anidamiento garantizado por construcción (testeado: misma comunidad en nivel ℓ ⇒ misma en ℓ+1), Q monótono no decreciente entre niveles (testeado), particion_en(nivel) construye el dendrograma a demanda. Particion = interfaz común de los tres algoritmos (grupo(id)/grupos()/tamanos(), grupos densos ordenados por menor miembro). Errores ComunidadesError (5 variantes) con Display+Error; ComunidadesStats (edges_scanned/pasadas/movimientos/niveles). 22 tests (tests_comunidades) + 4 doctests: Q a mano (dos tríos+puente: perfecta 5/14, trivial 0, singletons −17/98, γ=2 −1/7), self-loops ×2 y simetrización sumando (juntos 0 / separados −1/18) y paralelas acumuladas, escala de pesos no cambia Q, límite de RESOLUCIÓN Fortunato-Barthélemy DEMOSTRADO (anillo de 12 tríos: γ=1 → 6 pares con Q 17/24; γ=2 → los 12 tríos con Q 7/12; niveles [12→6]), jerarquía con invariante de contracción nivel a nivel, dos K4+puente separadas (Q=11/26), ground truth sintético recuperado exacto (3 anillos con cuerdas + 2 eslabones, Q ≥ Q_truth), pesos que RESTRUCTURAN (puente w100 ROMPE los tríos: {0,2},{1,4},{3,5} con Q=100/2809 — Q invariante a escala: no es 'más peso = más fusión'), multigrafo paralelas ≡ peso sumado, demo_graph (Dani solo por su self-loop; DOS óptimos con Q=5/18 y el dq EXACTAMENTE 0 que los separa), determinismo doble ejecución, vacío/aislados/max_pasadas=1 (la agregación REPARA el nivel truncado)."
