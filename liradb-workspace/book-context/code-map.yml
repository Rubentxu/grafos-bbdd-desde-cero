  - chapter: "vol2-cap-12"
    title: "El gestor de páginas (trait Pager + FilePager)"
    crates:
      - vol2-liradb
    snippets: []
    notes: "Trait Pager (allocate/read/write/sync/free/num_pages/is_allocated/page_size) + FilePager basado en std::fs::File (seek/read_exact/write_all/sync_all). Free list LIFO en memoria (no persistida, tema cap 14). Free list pierde tras reopen (decisión pedagógica documentada con test). Dev: tempfile 3.10 para tests. 18 tests propios."
    status: DONE
  - chapter: "vol2-cap-13"
    title: "El buffer pool (Clock, LRU, métricas)"
    crates:
      - vol2-liradb
    snippets: []
    notes: "BufferPool genérico sobre Pager (trait port + adapter hexagonal). Frames de PAGE_SIZE bytes, page_table (PageId → FrameId), pin/unpin explícitos, dirty tracking, flush (escribe sucios a disco + sync del pager) y flush_page selectivo. Política de reemplazo seleccionable: Clock (defecto, aguja avanza en cada acceso, second chance con ref_bit) o Lru (contador global monotónico). Errores tipados (BufferPoolError: Io, UnknownPage, BadPinCount, PoolFullOfPinned). Métricas (Metrics: page_reads/page_writes/buffer_hits/buffer_misses/evictions + hit_ratio()). Sin crates externas. 24 tests propios: básicos, eviction, dirty-flush-on-evict, PoolFullOfPinned, persistencia end-to-end con FilePager (cargar → modificar → flush → close → reopen → releer), reload-via-pool (pool vacío tras reopen = primer get es miss), second-chance protection (Clock), LRU evicta menos reciente."
    status: DONE
  - chapter: "vol2-cap-14"
    title: "Cómo almacenar adyacencias (CSR persistente)"
    crates:
      - vol2-liradb
    snippets: []
    notes: "CSR (Compressed Sparse Row) implementado a mano sobre BufferPool<Pager>. Tipos: CsrHeader (24B en página 1 con counts + page ids de las 4 columnas), Csr (in-memory: forward/backward offsets u64 + targets u32), PersistentCsr (wrapper sobre BufferPool con create/open/replace/load), CsrError tipado (Io/InvalidNodeId/InvalidEdge/Inconsistent/TooLarge). Layout on-disk: cada array = 1 SlottedPage con 1 record = chunk (header 9B + valores little-endian). Cuatro columnas: forward_offsets, forward_targets, backward_offsets, backward_targets. Self-loops y multigrafo admitidos. Errores tipados. Sin crates externas. 28 tests propios: chunk roundtrip, from_edges (vacío/triángulo/self-loops/multigrafo/aislados), verify (offsets monotónico, total mismatch, target out-of-range), header roundtrip, errores display/From, create+load vacío, replace+load, replace sobreescribe, replace mantiene invariantes, disk roundtrip via FilePager (escribir → close → reopen → load), dos replaces consecutivos con reopen, open sin header falla, métricas tras reload, suma total de degrees == edge_count (verificación con generador determinista LCG)."
    status: DONE
  - chapter: "vol2-cap-15"
    title: "Índices para encontrar datos (hash + B+ tree)"
    crates:
      - vol2-liradb
    snippets: []
    notes: "Dos índices secundarios persistentes sobre BufferPool<Pager> sin crates externas. HashIndex: hash FNV-1a 64-bit sobre claves u64, con catálogo (HashIndexHeader 16B en página 2, magic 0x4849_4431) + N buckets primarios (páginas 3..3+B-1), overflow encadenado vía BucketHeader (4B) en el primer record de cada SlottedPage. Búsqueda O(1) amortizado, insert con reemplazo, hash_distribution_is_reasonally_balanced (1000 claves / 16 buckets). BPlusTree: single-level (raíz = hoja) con BPlusHeader (16B, magic 0x4250_4C55), entradas ordenadas (TreeEntry 16B = key u64 + value u64) como records separados de la SlottedPage. Búsqueda binaria O(log N), range_scan en orden ascendente. Errores tipados IndexError (Io/UnknownSlotKind/Inconsistent/PageNotAllocated/InvalidParam) con From<PagerError> y From<BufferPoolError>. Sin crates externas — implementación a mano coherente con la regla 'primero a mano, luego con crate'. 27 tests propios: errores display/From, FNV-1a valores conocidos, header/entry roundtrip, hash create+open vacío, hash insert/get básico + replace, hash overflow chain (200 claves / 2 buckets), hash disk roundtrip via FilePager, hash open sin catálogo falla, hash zero buckets rechazado, bplus header/entry roundtrip, bplus create+get vacío, bplus insert+get+replace, bplus range_scan, bplus persistence via FilePager, bplus open sin root falla, bplus bad magic (en disco y en memoria) detectado por open. Cap declarado explícitamente: limitaciones BPlusTree = single-level + sin deletes + insert falla con InvalidParam si la raíz se llena (rebuild requerido)."
    status: DONE
  - chapter: "vol2-cap-16"
    title: "Compactación y mantenimiento (inspect|check|compact)"
    crates:
      - vol2-liradb
    snippets: []
    notes: "Herramientas de mantenimiento del motor de almacenamiento (Parte III) sobre Pager/BufferPool/SlottedPage/MetaPage existentes, sin crates externas. Tres operaciones (hitos CLI del brief §cap 16): inspect() → StorageStats (totals, allocated/free pages, data/meta pages, bytes_on_disk/used/free, total_records, fragmentation_ratio(), utilization()); check() → CheckReport con IntegrityIssue { page_id, kind: IssueKind } (BadMagic/PageIdMismatch/FreeSpaceMismatch/RecordTruncated/Undecodable) verificando 4 invariantes (caps 11-12): magic válido, page_id==offset, records decodifican, free_space declarado==real; repack_page() → RepackResult (reescritura in-place de una Data page: records consecutivos, free_space recalculado, bytes basura a cero); compact() → CompactReport (repack masivo + inspect antes/después, skip páginas corruptas sin tocarlas). Errores tipados MaintenanceError (Io/BufferPoolError/BadPageType/DecodeFailed/PageNotAllocated) con From<BufferPoolError> y From<PagerError>. Decisión clave: compact es repack in-place (PageId=offset físico, NO se mueven páginas para no romper CSR/índices/punteros); vacuum/truncate declarado como limitación (tema caps 29/36). check es read-only. inspect tolerante a corrupción (no aborta). Lectura vía pager subyacente (offline, sin calentar caché). 25 tests propios: ratios vacíos/básicos, inspect vacío/conta records/free pages/tolerancia a corrupta, check limpio/detecta bad magic/page_id mismatch/free_space mismatch/skip free pages, repack idempotente/corrige free_space/rechaza meta/no-asignada/corrupta, compact repackea todas/corrige stats/salta corruptas, persistencia via FilePager (inspect+check tras reopen, repack+sync persiste fix), errores display/From/source, límite sin data pages. Cierra la Parte III (motor de almacenamiento)."
    status: DONE
  - chapter: "vol2-cap-17"
    title: "Diseñar un lenguaje pequeño (MATCH-WHERE-RETURN mini)"
    crates:
      - vol2-liradb
    snippets: []
    notes: "Diseño del lenguaje de consulta LiraQL (abre la Parte IV 'Consultar el grafo'). NO es lexer/parser (eso es cap 18): fija el VOCABULARIO del lenguaje — tokens, gramática (EBNF documentada), AST, expresiones, patrones y errores con posición. Tipos: Span (rango start..end en bytes, con new/at/merge/is_empty/len), TokenKind (Match/Where/Return/As/And/Or/Not/True/False/Null + Ident/Integer/Float/String + puntuación LParen/RParen/LBracket/RBracket/LBrace/RBrace/Comma/Colon/Dot + flechas ArrowRight/ArrowLeft/DashDash + Dash (este último se introduce formalmente en cap 18) + comparadores Eq/NotEq/Lt/Lte/Gt/Gte + Eof; PartialEq sin Eq porque Float(f64) no es Eq), Token { kind, span }. Expresiones (Expression): Literal { value: Value, span } reutiliza Value del cap 7 (no duplica tipos), Variable { name, span } (referencia a variable ligada, introducido en cap 18 para el hito RETURN p), PropertyAccess { variable, property, span } (p.name), Compare { op: CompareOp, left, right, span }, And/Or { left, right, span }, Not { expr, span }; con span(), lit(), var(), prop(), references_var() y variables() para análisis semántico. Patrones: NodePattern { variable?, label?, properties: Vec<(String, Expression)>, span }, RelationshipPattern { variable?, rel_type?, direction: RelDirection (Outgoing/Incoming/Undirected), span }, PathPattern { start: NodePattern, chain: Vec<(RelationshipPattern, NodePattern)>, span } con node_patterns()/node_variables()/edge_variables(). Cláusulas: MatchClause { patterns: Vec<PathPattern>, span } (bound_node_variables/bound_edge_variables), WhereClause { expr, span } opcional, ReturnClause { items: Vec<ReturnItem>, span } (ReturnItem { expr, alias?, span }). AstNode enum del hito del brief: Match(MatchClause)/Where(WhereClause)/Return(ReturnClause). Query { match_clause, where_clause?, return_clause, span } con validate() → Vec<QueryError> (is_valid() atajo, bound_node_variables/bound_edge_variables delegados). Errores tipados QueryError { kind: QueryErrorKind, span } (EmptyMatch/EmptyNodePattern/DuplicateVariable{variable}/UnknownVariable{variable}/EmptyReturn/EmptyAlias) con Display que incluye el span (estilo rustc/miette) e impl std::error::Error. Pretty-printer (Display) canónico para CompareOp/RelDirection/Expression/NodePattern/RelationshipPattern/PathPattern/MatchClause/WhereClause/ReturnItem/ReturnClause/Query (round-trip para tests y liradb explain cap 21); hex_bytes() propio para Value::Bytes (sin crates). Validación semántica: MATCH no vacío, node pattern no trivial (no '()' puro), sin variables duplicadas (nodos ni nodo↔arista), RETURN no vacío, alias no vacío, variables de WHERE/RETURN declaradas en MATCH. Sin crates externas — diseño puro. 41 tests propios (tests_query). El lexer + parser descendente llegan en cap 18."
    status: DONE
  - chapter: "vol2-cap-18"
    title: "Construir el lexer y el parser"
    crates:
      - vol2-liradb
    snippets: []
    notes: "Implementa Texto → Tokens → AST siguiendo el hito del brief (§cap 18: parse('MATCH (p:Person) RETURN p')). Lexer + parser descendente recursivo MANUAL, sin crates externas (logos/pest se reservan para apéndice comparativo, conforme a la regla 'primero a mano, luego con crate' y a la propuesta del brief §11 'logos + parser descendente manual'). Reutiliza todos los tipos del cap 17 (TokenKind, Token, Span, Query, Expression, NodePattern, RelationshipPattern, PathPattern, MatchClause, WhereClause, ReturnClause, AstNode). Cambios al AST del cap 17 para soportar el hito: (1) TokenKind::Dash (guión simple, necesario para los extremos -[ ... ] y ]- de las relaciones entrantes/sin dirección); (2) Expression::Variable { name, span } (referencia a variable ligada sin .propiedad, hito RETURN p). Lexer (Lexer struct sobre &[u8] con cursor pos): scan_token con despacho por primer byte, maximal-munch (reconoce -> antes que -, <> antes que <), skip_whitespace (no produce token, span apunta sólo al contenido útil), scan_identifier (case-sensitive: mayúsculas → keyword, resto → Ident), scan_number (Integer i64 con checked_mul/checked_add para detectar overflow → IntegerOverflow; Float con parte fraccionaria sólo si hay dígito tras el punto, sino Integer+Dot), scan_string (escapes \\n \\t \\r \\\\ \\\" \\0, error InvalidEscape en \\q, UnterminatedString si EOF). Errores léxicos tipados: LexError { kind: LexErrorKind, span } con LexErrorKind (UnexpectedChar{byte}/UnterminatedString/InvalidEscape{byte}/IntegerOverflow/MalformedNumber), Display con sufijo de localización (en offset/en start..end estilo rustc/miette), impl std::error::Error. Parser (Parser struct sobre Vec<Token> con cursor current): descendente recursivo predictivo, una función por regla EBNF del cap 17 (parse_match_clause/parse_path_pattern/parse_node_pattern/parse_relationship_pattern/parse_where_clause/parse_return_clause/parse_return_item), precedencia de operadores por cadena de funciones parse_or → parse_and → parse_not → parse_comparison → parse_primary (precedence climbing por funciones, sin tabla), match_kind/check/expect/peek/advance helpers de cursor. Relaciones: parsea -[ ... ]-> (OUTGOING), <-[ ... ]- (INCOMING), -[ ... ]- (UNDIRECTED) y -- (UNDIRECTED sin corchetes) construyendo RelationshipPattern.direction. Return item: alias explícito con AS o implícito (identificador suelto que no sea keyword de cláusula). Errores sintácticos tipados: ParseError { kind: ParseErrorKind, span } con ParseErrorKind (Lex(LexError) propagado / UnexpectedToken{expected,found} / UnexpectedEof / MissingMatch / MissingReturn / PathMustStartWithNode / MalformedRelationship / TrailingTokens{found}), Display legible con describe_kind(), impl std::error::Error con source() apuntando al LexError, From<LexError>. API pública: parse(src) y parse_query(src) alias. Decisión de recovery: reportar primer error con posición y abortar (suficiente para lenguaje didáctico; recovery multi-error estilo pest se deja como ejercicio). Sin crates externas. 73 tests propios (tests_lexer_parser): lexer (palabras clave case-sensitive/identificadores/puntuación/flechas y guiones/comparadores/EOF/spans exactos/UTF-8 aware en bytes/strings simples+vacíos+escapes+errores/números enteros+flotantes+overflow/caracter inesperado+hex/Display/impl std::error::Error), parser hito del brief (RETURN p), MATCH (node pattern variable/label/anónimo/propiedades/relación saliente/entrante/sin dirección/con variable/anónima sin tipo/path 3 nodos/múltiples patrones coma), WHERE (comparación simple/todos los comparadores/AND/OR/NOT/precedencia OR<AND<NOT/paréntesis rompe orden/sin cláusula/literales TRUE/FALSE/NULL), RETURN (varios items/alias AS/alias implícito/sin alias), errores sintácticos (no empieza por MATCH/falta RETURN/vacío/token inesperado en nodo/trailing tokens/lex propagado/Display/impl std::error::Error con source), round-trip parse→display→parse (consulta mínima/completa/con AND-OR idempotencia de forma canónica/dirección de relación preservada), consultas completas del brief (ejemplo cap 17/cap 19/inline props+WHERE), API pública (parse_query alias, Parser::from_tokens inyección directa, describe_kind cubre variantes)."
    status: DONE
