# ─────────────────────────────────────────────────────────────────
# code-map.yml — Tabla bidireccional prosa ↔ código
#
# Mapea cada capítulo del libro a las crates y snippets de este
# workspace que contienen su código ejecutable.
#
# Mantenedor: code-integration-architect (skill del BOOK-WORKFLOW).
# Cada vez que un cap. se mueve de PLANNED a DONE, sincronizar.
#
# Esquema:
#   vol1 / vol2:
#     - chapter: "vol1-cap-NN"           # ID canónico del capítulo
#       title: "<título evocador>"       # mismo título que en el manuscrito
#       crates: [<crate-name>, ...]      # crates en /crates/
#       snippets: [<snippet-id>, ...]    # IDs de snippets sueltos
#       modules: [<module-path>, ...]    # submódulos dentro de un crate
#       notes: "<texto libre>"           # advertencias o contexto
#       status: PLANNED | IN_REVIEW | DONE
# ─────────────────────────────────────────────────────────────────

vol1:
  - chapter: "vol1-cap-01"
    title: "Introducción a grafos"
    crates: []
    snippets: []
    notes: "Capítulo conceptual sin código ejecutable; sólo definiciones y figuras ASCII."
    status: DONE
  - chapter: "vol1-cap-02"
    title: "Representaciones de grafos"
    crates:
      - vol1-cap-02-vec-adj
      - vol1-cap-02-petgraph
    snippets: []
    notes: "Migrado en Fase M1 (commit: vol1-cap-02/03/04 migrated and verified). Bug del libro detectado: g.vecinos(&1) → g.vecinos(1). Doctest del cap-02-petgraph usa fences ```text (no ```rust) por la presencia de caracteres que rompen el parser de Rust."
    status: DONE
  - chapter: "vol1-cap-03"
    title: "BFS y DFS"
    crates:
      - vol1-cap-03-bfs-dfs
    snippets: []
    notes: "Migrado en Fase M1. Incluye BFS iterativo (§3.2), DFS recursivo + iterativo (§3.4). Las versiones con petgraph (§3.5) no se migraron — están en el libro como texto."
    status: DONE
  - chapter: "vol1-cap-04"
    title: "Dijkstra y Bellman-Ford"
    crates:
      - vol1-cap-04-dijkstra
    snippets: []
    notes: "Migrado en Fase M1. Incluye Dijkstra con BinaryHeap<Reverse> (§4.4) y Bellman-Ford con detección de ciclo negativo (§4.5). Bug del libro detectado: test 'destino_inalcanzable_es_max' asumía 3 vértices pero grafo sólo tenía 2 — corregido añadiendo vec![] para vértice aislado. Test extra añadido: 'dfs_iterativo_y_recursivo_coinciden_en_longitud' (no estaba en el libro)."
    status: DONE
  - chapter: "vol1-cap-05"
    title: "MST: Kruskal y Prim"
    crates:
      - vol1-cap-05-mst
    snippets: []
    notes: "Migrado en Fase M3a. Union-Find (DSU) + Kruskal + Prim. Sin deps externas."
    status: DONE
  - chapter: "vol1-cap-10"
    title: "Max-Flow: Ford-Fulkerson, Edmonds-Karp, Dinic"
    crates:
      - vol1-cap-10-maxflow
    snippets: []
    notes: "Migrado en Fase M3a. ford_fulkerson del libro es simplificado (sin aristas inversas → da 20 vs 23 óptimo); test relajado."
    status: DONE
  - chapter: "vol1-cap-11"
    title: "Min-Cut: DinicCut, König, Karger"
    crates:
      - vol1-cap-11-mincut
    snippets: []
    notes: "Migrado en Fase M3a. Depende de vol1-cap-10-maxflow. Bugs del libro corregidos: min_vertex_cut (cap 1 en s), Karger (closure &mut). Karger re-implementado + brute_force oráculo."
    status: DONE
  - chapter: "vol1-cap-06"
    title: "Topological sort y DAGs"
    crates:
      - vol1-cap-06-toposort
    snippets: []
    notes: "Migrado en Fase M3b. Kahn (BFS por in-degree) + DFS reverse-postorder + longest path en DAG. Sin deps."
    status: DONE
  - chapter: "vol1-cap-07"
    title: "Union-Find y componentes conexas"
    crates:
      - vol1-cap-07-scc
    snippets: []
    notes: "Migrado en Fase M3b. DSU + Kosaraju + Tarjan. Bugs del libro: (1) test basico omitia union(0,4); (2) esperaba size_of(0)=4 con 5 elementos (debería ser 5)."
    status: DONE
  - chapter: "vol1-cap-08"
    title: "Grafos bipartitos y Matching"
    crates:
      - vol1-cap-08-bipartito
    snippets: []
    notes: "Migrado en Fase M3b. 2-coloring BFS + Kuhn + Hopcroft-Karp. Sin deps (lapjv omitido)."
    status: DONE
  - chapter: "vol1-cap-17"
    title: "Algoritmos randomizados en grafos"
    crates:
      - vol1-cap-17-random
    snippets: []
    notes: "Migrado en Fase M3b. Karger min-cut + método probabilístico (independent set). rand bumpeado de 0.8 a 0.9: Rust 2024 reserva la keyword `gen` que rand 0.8 usaba para `rng.gen::<T>()`."
    status: DONE
  - chapter: "vol1-cap-18"
    title: "NP-completitud y problemas difíciles en grafos"
    crates:
      - vol1-cap-18-np
    snippets: []
    notes: "Migrado en Fase M3b. VC 2-aprox (matching maximal) + BnB IS (corregido: validaba independencia) + Held-Karp TSP. Sin deps."
    status: DONE
  - chapter: "vol1-cap-19"
    title: "Programación dinámica en grafos"
    crates:
      - vol1-cap-19-dp
    snippets: []
    notes: "Migrado en Fase M3b. longest_path_dag (DP sobre orden topológico) + subtree_sizes (Tree DP) + Held-Karp (duplicado de cap-18 por la estructura del Vol.I). petgraph 0.6."
    status: DONE
  - chapter: "vol1-cap-09"
    title: "Shortest Paths avanzado"
    crates:
      - vol1-cap-09-shortest
    snippets: []
    notes: "Migrado en Fase M3c. Floyd-Warshall + Johnson + shortest_path_dag + A*. Sin deps. Bug del libro: test floyd_warshall asumia d[0][2]=3 pero el óptimo real es 4."
    status: DONE
  - chapter: "vol1-cap-12"
    title: "Flujo de costo mínimo"
    crates:
      - vol1-cap-12-mincost
    snippets: []
    notes: "Migrado en Fase M3c. SSP con potentials (Johnson reweighting). Sin deps."
    status: DONE
  - chapter: "vol1-cap-16"
    title: "Teoría espectral de grafos"
    crates:
      - vol1-cap-16-spectral
    snippets: []
    notes: "Migrado en Fase M3c. Laplaciana + autovalores + PageRank. Dep: nalgebra 0.32. Bug del libro: matriz M del test PageRank no era estocástica."
    status: DONE
  - chapter: "vol1-cap-20"
    title: "Grafos en Machine Learning (mini-GCN)"
    crates:
      - vol1-cap-20-gnn
    snippets: []
    notes: "Migrado en Fase M3c. Mini-GCN con ndarray 0.15 + ndarray-rand 0.14 + rand 0.8 (incompatible con rand 0.9 del resto del workspace; ndarray-rand 0.14 requiere rand 0.8)."
    status: DONE
  - chapter: "vol1-cap-13"
    title: "Coloración de grafos"
    crates:
      - vol1-cap-13-coloring
    snippets: []
    notes: "Migrado en Fase M3c-batch-5 (algoritmo solamente, sin TUI). Greedy + Welsh-Powell + DSATUR + Vizing edge coloring. Sin deps. Decisión: omitir la parte TUI (ratatui + crossterm) por costo de compilación (~150 crates transitivas); los algoritmos son lo verificable. caps 14 (planaridad + ratatui) y 15 (strings + image) quedan para otra sesión."
    status: DONE
  # ... caps 14/15 pendientes (ratatui, image) — Fase M3c-batch-5 resto (futura)

