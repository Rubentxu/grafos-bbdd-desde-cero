  - chapter: "vol2-cap-27"
    title: "Qué significa una transacción (ACID)"
    crates:
      - vol2-liradb
    modules: [cap27_transacciones]
    snippets: []
    notes: "ABRE la Parte VI (fiabilidad). Capítulo CONCEPTUAL + primera maquinaria transaccional (el brief manda: atomicidad, consistencia, aislamiento, durabilidad, autocommit, transacciones explícitas, lecturas sucias, lost updates; modelo «múltiples lectores, un único escritor»). Dos piezas: (1) VOCABULARIO ACID TIPODO — GarantiaAcid (letra/nombre/definición para LiraDB), NivelGarantia (Ninguna/Parcial/Completa), EntradaAcid + informe_acid() el informe EJECUTABLE y honesto del estado actual (A parcial: staging «o todas o ninguna» frente a errores de validación pero no a un fallo del apply real; C parcial y trivial: sólo invariantes estructurales, sin restricciones declarativas; I parcial por diseño: sin concurrencia, el préstamo exclusivo &mut del store ES el cerrojo — el borrow checker ejecuta la política del brief; D NINGUNA: commit en RAM, el camino existe con sync cap 12 / flush cap 13 pero falta el protocolo WAL cap 28) y Anomalia (lectura sucia y actualización perdida, definidas como vocabulario que el cap 30 hará posibles y combatirá). (2) TRANSACCIÓN COMO OBJETO — Transaccion<'a> sobre &mut dyn GraphStore con begin → staging (put_node/put_edge/delete_node/delete_edge acumulan Operacion en un buffer privado; el store NO se toca hasta el commit) → commit/rollback que CONSUMEN self: el ciclo de vida vive en los tipos (usar una tx cerrada o anidar dos tx no compila). Commit = re-validación del buffer entero (validar_buffer: replay sobre una Simulación con sets de nodos/aristas creados/borrados que respeta el orden del buffer — edges tras sus nodos, cascadas de delete_node, re-creaciones tras borrar) y sólo entonces apply operación a operación con ResumenCommit (cuenta OPERACIONES, no cascadas). Rollback = descarte limpio por construcción (nada se aplicó); drop de una tx activa = rollback implícito seguro. autocommit() hace visible el modo por defecto de los caps 7-26 (cada put_* era su propia tx). Errores tipados TransaccionError (OperacionInvalida{indice,causa}: nada aplicado, la tx sigue viva; ApplyFallido{indice,aplicadas,causa}: el store QUEDÓ A MEDIOS — el gancho al cap 28) con Display+Error. LÍMITES DEMOSTRADOS EN TESTS como expectativas: StoreQueFalla (wrapper de test que falla en la N-ésima escritura por Err o por pánico) → commit Err(ApplyFallido{aplicadas:2}) con node_count()==2, y catch_unwind del «corte de luz» → store a medias sin nadie que recuerde qué faltaba. Validación O(n·(n+E)) naive y documentada (cada stage revalida el buffer; claridad sobre eficiencia). Sin crates externas. 28 tests + 1 doctest."
