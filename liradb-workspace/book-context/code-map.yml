  - chapter: "vol2-cap-20"
    title: "El motor de ejecución (modelo Volcano)"
    crates:
      - vol2-liradb
    snippets: []
    notes: "EJECUTA el plan lógico del cap 19 sobre un grafo real y devuelve filas: cierra el hito del brief §cap 20 'ejecutar consultas completas desde texto' con run(src, store) = parse → lower → compile → Volcano → ResultSet. Modelo Volcano (Graefe 1994): cada operador es un ITERADOR pull-based con la tríada open()/next()/close() (trait PhysicalOperator, la interfaz exacta del brief + name()/rows_produced()/collect_metrics() para métricas). Filas: Row { entries: Vec<(String, Cell)> } — la materialización en ejecución de los Bindings del cap 19 (NodeScan crea, Expand extiende con clon, CartesianProduct concatena con merge(), Project re-liga a columnas de salida); Cell = Scalar(Value cap 7) | Node | Edge (una variable entera evalúa al ELEMENTO: RETURN p / RETURN r). Operadores (los 7 del brief + cartesiano): NodeScanOp (cursor perezoso sobre GraphStore::iter_nodes, filtro de label, orden del store determinista), IndexSeekOp (liga exactamente los NodeIds que recibe — la SELECCIÓN del índice se difiere al optimizador cap 21, que es donde el brief lo usa; id inexistente → ExecError::UnknownNode por índice desactualizado), ExpandOp (bucle anidado clásico: por cada fila del input recorre out_edges/in_edges según RelDirection; UNDIRECTED recorre ambas y cuenta el self-loop UNA vez; filtra por rel_type; liga rel_variable si el patrón la nombra), FilterOp (evalúa el predicado con eval_scalar: TRUE pasa, FALSE y NULL se descartan — lógica trivalente), ProjectOp (una celda por Projection, nombrada por output_name()), CartesianProductOp (MATERIALIZA su lado derecho en open(): Volcano es monotónico, no rebobina — el coste que el cap 21 evitará), LimitOp y DistinctOp (operadores completos aunque la gramática LiraQL aún no exponga LIMIT/DISTINCT: listos para la CLI cap 31 y el optimizador). Evaluación eval_scalar(ScalarExpr, &Row): literales; p.name → propiedad ausente = NULL (schemaless); HasLabel sobre arista → NULL (desconocido); comparaciones con semántica SQL/Cypher (NULL domina, Int/Float promocionan, igualdad de tipos distintos = false estilo Cypher, orden sólo numérico/string, igualdad de nodos/aristas POR IDENTIDAD de id → WHERE a = b encuentra self-loops); AND/OR/NOT trivalentes con CORTOCIRCUITO real (FALSE AND x / TRUE OR x no evalúan x — observable con errores de tipos en el operando elidido). Executor: compile(plan, store) traduce LogicalPlan→árbol físico 1:1; Executor::new exige Project raíz (columnas) y execute() hace open → next* → close SIEMPRE (también en error); metrics() expone ExecMetrics { per_operator: Vec<(nombre, filas)>, rows_returned } — semilla del explain con cardinalidades REALES del cap 21. ResultSet { columns, rows: Vec<Vec<Cell>> } con Display en tabla alineada (semilla de la CLI cap 31). API de alto nivel: Query::execute(&store) y run(src, &store). Errores tipados ExecError (Parse/Plan envueltos con From + source(), UnboundVariable/NotANode/PropertyOnScalar defensivos, UnknownNode, TypeMismatch en ejecución — la concreción runtime del Any schemaless—, NotAProjection) con Display + std::error::Error. El executor consume el trait GraphStore del cap 8 (hexagonal): MemoryStore hoy, store en disco mañana. Sin crates externas. 37 tests propios (tests_executor): Row/Cell bind-get-merge-display, evaluación (literales/vars/props presentes-ausentes/HasLabel nodo y arista→NULL/comparaciones NULL+promoción+tipos cruzados+orden/igualdad de nodos por identidad/tabla trivalente AND-OR-NOT completa/cortocircuito observable/errores defensivos), operadores (NodeScan todos-label-orden y ciclo open-close-reopen/IndexSeek ids exactos y stale/Expand outgoing con filtro de tipo-incoming-undirected con self-loop una vez-liga rel var-error defensivo/Filter true-false-null y error runtime no bool/Project columnas y alias/cartesiano 4x2=8/Limit corta pipeline con métricas/Distinct deduplica e idempotente), hito e2e (consulta canónica del brief/MATCH solo + RETURN var entera de nodo y arista/WHERE AND-OR-NOT/NULL no pasa ni con NOT/props inline y props de arista r.since/direcciones entrante y sin dirección/camino 2 tramos con anónimo intermedio/self-loop con a=b/label inexistente vacío con columnas intactas/Query::execute == run/errores parse-plan-runtime con source()), métricas por operador del ejemplo canónico y del cartesiano, Display tabla con anchos y column()."
