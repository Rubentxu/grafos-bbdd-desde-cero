  - chapter: "vol2-cap-28"
    title: "Write-ahead log"
    crates:
      - vol2-liradb
    modules: [cap28_wal]
    snippets: []
    notes: "Parte VI (fiabilidad), cap 2 de 4. Regla central del brief: «el cambio se escribe en el WAL antes que en la página de datos» — el germen del cap. 10 (AppendOnlyLog con length-prefix + CRC32) promocionado a WAL real, que RESUELVE los dos tests de regresión inversa que el cap. 27 dejó plantados. (1) EL REGISTRO: WalRecord {lsn: Lsn (u64 MONÓTONO y consecutivo desde 1, NUNCA se reutiliza ni tras truncar), tx_id: TxId, cuerpo: CuerpoWal} con CuerpoWal = Begin | Operacion(Operacion) | Commit | Rollback (el guion manda begin/commit/rollback como registros del log). La Operacion es la MISMA del cap 27 (la semilla del RecordKind del cap 10 era deliberada), serializada con el encoding del cap 9 (strings/values, props ORDENADAS por clave para determinismo de bytes y CRC) bajo el framing del cap 10 ([record_len u32][lsn u64][tx_id u64][tag u8][payload][crc32]) — sólo se añade u64 LE, helper local. (2) EL PROTOCOLO: WalTransaccion<'a> sobre (&mut store, &mut wal) hereda el staging del cap 27 (mismo buffer, misma validación eager reutilizada vía validar_buffer ahora pub(crate), rollback gratis ANTES del punto de no retorno + marker Rollback SIN fsync: la ausencia de Commit ya aborta) y su commit es DOS FASES: re-validar → log_write de cada operación (write-AHEAD; sync según PoliticaFlush) → registro Commit + sync (EL punto de durabilidad) → apply al store. DECISIÓN CLAVE documentada: commit-marker-ANTES-del-apply (roll-forward): un apply a medias queda CON commit durable en el log y replay_wal lo COMPLETA; la alternativa (marker al final) exigiría UNDO — ARIES es cap 29. (3) REDO: replay_wal(store, wal) en dos pasadas (1: colecciona txs con Commit; 2: re-aplica sus operaciones en orden de LSN con aplicar_para_redo IDEMPOTENTE — put idéntico=no-op, put divergente=overwrite (el log manda), delete ausente=no-op) → InformeReplay {confirmadas, descartadas, operaciones_reaplicadas}. TEST-TESIS que INVIERTE la regresión del cap 27: StoreQueFalla local (fallo Err en la 3ª escritura de 4 → ApplyFallido{aplicadas:2}, node_count()==2 A MEDIAS como en cap 27) + replay_wal = node_count()==4 TRANSACCIÓN COMPLETA; variante pánico «corte de luz» con catch_unwind → mismo rescate (el log SÍ recuerda). (4) CORRUPCIÓN: WalIterator con PARADA LIMPIA (primer registro truncado/CRC roto/LSN no consecutivo = fin del log legible: se confía en el prefijo íntegro) — replay no falla, sencillamente no ve la cola; decodificar_wal es el modo ESTRICTO que grita (CrcInvalido{lsn aparente}, RegistroTruncado, LsnInvalido{hueco}). Commit record a medias por corte de luz → tx NO confirmada (descartada sin error). (5) TRUNCADO (guion: log truncation): truncar_hasta_lsn(lsn) descarta el prefijo con CONTRATO firmado por el llamador (sólo lo YA durable en el store); LSNs jamás se reutilizan; la deuda del contrato roto es TEST (replay sobre store vacío pierde lo truncado; y dependencias rotas → RedoFallido{lsn} ruidoso). Checkpoint automático y ROTACIÓN por tamaño: deuda documentada para cap 29. (6) FLUSH/GROUP COMMIT (guion): PoliticaFlush::CadaEscritura (por defecto, la regla de oro literal: un sync por log_write — 4 ops = 5 syncs) vs SoloCommit (UN sync por transacción, correcto porque las páginas de datos no se van a disco antes del commit; mismo replay testeado); Wal::sync() es CONTADOR (la promesa medible: en RAM no hay disco; el fsync real es FilePager::sync cap 12). Group commit REAL (varias tx concurrentes, un fsync): sin concurrencia — semilla plantada, cap 30. (7) informe_acid_post_wal() re-valora con los tipos del cap 27: D Ninguna→Parcial (commit durable EN EL LOG; store en RAM, reopen cap 29), A sigue Parcial pero cap 28→29 (roll-forward funciona, falta el arranque automático). WalError (7 variantes: Serializacion, CrcInvalido, RegistroTruncado, LsnInvalido, Validacion(TransaccionError), ApplyFallido{indice,aplicadas,causa} con Display que enseña la NUEVA resolución («replay_wal COMPLETA»), RedoFallido{lsn,causa}) con Display+Error+source. Sin crates externas. 26 tests + 1 doctest."
    status: DONE
  - chapter: "vol2-cap-29"
    title: "Recuperación después de un fallo (ARIES simplificado)"
    crates:
      - vol2-liradb
    modules: [cap29_recuperacion]
    snippets: []
    notes: "Parte VI (fiabilidad), cap 3 de 4. CIERRA la recuperación: el arranque AUTOMÁTICO que el cap 28 dejó a mano, con el esqueleto de ARIES (Mohan et al. 1992) Analysis-Redo-Undo. (1) ANÁLISIS: analizar(wal) recorre el log hacia delante (Wal::iter, parada limpia) y reconstruye la tabla de transacciones EstadoTx (Activa/Confirmada/Abortada → ganadoras/perdedoras), los contadores next_lsn/next_tx_id (reabrir = escanear el log) y la dirty element table ElementoId (Nodo/Arista → primer LSN que lo tocó; la dirty page table de ARIES a nivel de elemento). (2) REDO: redo(store, analisis) re-aplica TODAS las operaciones (ganadoras Y perdedoras) en orden de LSN, idempotente (reutiliza aplicar_para_redo ahora pub(crate) del cap 28) — el store queda en el estado del instante del fallo; sin checkpoint es conservador (rehace todo). (3) UNDO: deshacer(store, analisis, antes) — la pieza NUEVA: en orden INVERSO de LSN deshace las perdedoras (PutNode/PutEdge → borrado idempotente; DeleteNode/DeleteEdge → restaurar la imagen anterior de AntesImagenes). TEST-TESIS del steal: una perdedora que ROBÓ escrituras al store (buffer pool que evacúa páginas sucias) queda LIMPIA tras el undo; y la FRONTERA honesta: un borrado robado SIN before-image se CUENTA en InformeUndo::operaciones_sin_before_image (no se inventa) — el hueco que ARIES completo cierra con CLR. (4) EL FICHERO: guardar_wal/cargar_wal persisten los bytes del log (el sync del cap 28 era un contador; aquí el fichero ES el almacenamiento estable) y Wal::reconstruir (cap 28) reabre escaneando: reabrir(store, path, antes) = leer fichero + reconstruir + analizar + redo + undo, el flujo de arranque completo. (5) CHECKPOINT + TRUNCADO SEGURO: Checkpoint {hasta_lsn, next_lsn, next_tx_id} congela lo durable y los contadores (para que truncar a vacío no reutilice identificadores); truncar_seguro(wal, cp) automatiza el truncado que el cap 28 dejaba firmado a mano; rotar_si_excede(wal, umbral) cierra la rotación por tamaño como checkpoint disparado por bytes. (6) informe_acid_post_recovery() re-valora: A sigue Parcial pero cap 29→30 (queda el before-image para borrados robados), D sigue Parcial pero cap 29→37 (el store de datos no tiene checkpoint independiente). RecoveryError (Io, Redo{lsn,causa}) con Display+Error+source. Sin crates externas. 20 tests + 2 doctests: análisis (tabla de txs y contadores, dirty table con primer LSN, log vacío, intercaladas, cola truncada parada limpia), recuperación (reenvía confirmadas/descarta no confirmadas, idempotente, política SoloCommit no cambia), steal (undo de escrituras robadas, borrado robado con/sin before-image), redo conservador medido con ContandoStore, checkpoint/truncado/rotación (LSN no reutilizados), fichero (roundtrip, reabrir, contadores reconstruidos), errores y re-valoración ACID."
