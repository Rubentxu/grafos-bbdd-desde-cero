del executor—/SharedPatternVariables —join entre patrones, cap 21—/TypeMismatch{context,expected,got}), Display con sufijo de span, impl std::error::Error. (6) Planner (privado) con lower_path (NodeScan + Expand* por camino; nodo anónimo → variable interna _n1/_e1 sin colisión con usuarios; label del nodo inicial alimenta el NodeScan, el de los nodos de la cadena baja como HasLabel al Filter; props inline bajan como igualdades) y build_scalar (resuelve nombres contra Bindings). API pública: lower(&Query) → Result<LogicalPlan,PlanError> + Query::lower(). Bug del brief corregido: su plan de ejemplo omitía imponer f:Person del patrón (habría devuelto conocidos de cualquier etiqueta); aquí baja como predicado HasLabel en el Filter — documentado en el banner del cap y en el test lower_display_ejemplo_canonico_del_brief. Display de LogicalPlan = pretty-printer indentado 2 espacios por nivel (formato del brief: 'Project(f.name) / Filter(...) / Expand(p, KNOWS, OUTGOING, f) / NodeScan(Person AS p)'), base directa de liradb explain (cap 21). Límites declarados: sin re-binding de variables en un patrón, sin join entre patrones que comparten variables, Filter sin push-down (todo cap 21). Sin crates externas. 40 tests propios (tests_logical_plan): LogicalType display/eq_compatible/order_compatible, Bindings declara/itera/duplicados, ScalarExpr display sin paréntesis redundantes + mínimos por precedencia/and_all left-asociativo/type_of literales+vars+props+comparaciones+lógicos, lowering base (MATCH nodo solo/ejemplo canónico del brief en texto y estructura/anónimo→_n1/sin label→ANY/props inline→Filter/WHERE+inline conjuntados/path 3 nodos encadena Expands/direcciones IN y UNDIRECTED/relación con variable y sin tipo→ANY/patrones disjuntos→CartesianProduct/RETURN alias y nombres derivados), errores semánticos (WHERE var no ligada con span del acceso/RETURN desconocido/prop inline desconocida/re-ligar variable/patrones comparten variables→join/MATCH y RETURN vacíos vía AST a mano)