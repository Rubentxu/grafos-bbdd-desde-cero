  - chapter: "vol2-cap-30"
    title: "Snapshots y concurrencia (MVCC limitado)"
    crates:
      - vol2-liradb
    modules: [cap30_mvcc]
    snippets: []
    notes: "Parte VI (fiabilidad), cap 4 de 4 — CIERRA la Parte VI. Resuelve la anomalía histórica del Vol.II: el modelo «un único escritor por el borrow checker» del cap. 27 impedía que DOS lectores leyeran a la vez sin bloquear al escritor. MvccStore mantiene, POR ELEMENTO, una cadena de versiones VersionNode/VersionEdge {ts_begin: Ts u64 lógico monótono, ts_end?: Ts, valor}; las lecturas con snapshot (leer_nodo, leer_arista, iter_nodos, iter_aristas) clonan la versión visible al ts del lector y NO bloquean al escritor (&self + clonar, sin locks — la cadena es el cerrojo, no un lock manager). El commit asigna un ts nuevo, RETIRA la versión actual (si la había) y APPENDIZA la nueva, validando contra el inner + simulación del propio buffer con validar_mvcc (semántica de SOBREESCRITURA, distinta del validar_buffer del cap. 27 que asume inserción estricta) y aplicando al inner con delete-then-put (MemoryStore es de inserción estricta cap. 8; la sobreescritura MVCC lo respeta); gc(hasta) purga versiones retiradas con ts_end < hasta y elimina las cadenas que quedan vacías. NivelAislamiento (LecturaSucia/Instantanea/Serializable) cierra el vocabulario abierto por el Anomalia del cap 27: Instantanea PROHÍBE lectura sucia y actualización perdida; write skew DEJA PASAR (la frontera que Serializable SI con predicate locks cerraría — queda documentada como anzuelo). GrafoEspera para detección O(V+E) de ciclos de deadlock por DFS con colores (3 estados: blanco/gris/negro; aristas T1 espera R que tiene T2); quitar_tx rompe el ciclo. Aunque hoy no pueden ocurrir deadlocks (un único escritor), la pieza existe para caps. futuros de concurrencia real. informe_acid_post_mvcc() re-valora: I avanza significativamente (lectura sucia y actualización perdida pasan a estar prohibidas, write skew sigue pasando — closer 40); A sigue Parcial (closer 31); C y D sin cambios. MvccError (Validacion, Store) con Display+Error+source y From<TransaccionError>. Sin crates externas. 21 tests: snapshots (lectura en ts anterior devuelve la versión visible, iter consistente tras mutar, varios snapshots coexisten sin bloquearse, delete retira la versión actual, versiones retiradas en el resumen, commit invalido no avanza el reloj, monotonic del reloj, siguiente_ts); GC (descarta versiones retiradas, elimina cadenas vacías); niveles de aislamiento (prohiben las anomalías esperadas); grafo de espera (vacío sin ciclo, lineal no es ciclo, ciclo de dos, ciclo de tres, quitar_tx rompe el ciclo, Display de Recurso); errores y resumen; re-valoración ACID."
