    notes: "Parte V (algoritmos sobre el grafo persistente), cap 2 de 5ish. El Vol.I (cap 9 §A*) ya enseñó el algoritmo in-memory en robótica/videojuegos; el ángulo del Vol.II: A* sobre el GRAFO PERSISTENTE con heurísticas definidas por el USUARIO de la API — primera vez que un algoritmo de la Parte V necesita datos del NODO (coordenadas), no sólo de la arista. Trait Heuristic { estimate(&self, store, node) -> Result<f64, PathError> } (trait, no closure: las heurísticas son familias CON ESTADO ligadas a un destino — coords, landmarks —, el contrato se documenta/valida en un solo sitio, y &dyn Heuristic evita genéricos contagiosos; una closure no podría leer el store sin capturarlo prestado). Implementaciones: ZeroHeuristic (h≡0 ⇒ A* degenera en Dijkstra: mismo orden de pops, testeado) y EuclideanHeuristic::new(store, dest, x_prop, y_prop) (distancia recta leyendo props x/y de NODO con la MISMA semántica estricta que edge_weight del cap 22: ausente/NULL=MissingCoordinate, no numérico o NaN=InvalidCoordinate, Int promociona; destino validado eager en construcción, resto on-demand al pisarlos; admisible+consistente POR CONSTRUCCIÓN cuando los pesos son distancias en las unidades de las coords — carretera ≥ recta). a_star(store, origin, dest, weight, &dyn Heuristic) -> Result<Option<Path>, PathError>: REUTILIZA cap22 tal cual (WeightSource/edge_weight, sanidad eager de pesos negativos EXTRAÍDA a validate_edge_weights pub(crate) compartida, Path/PathStats/PathError); heap Reverse<(Cost(f), Cost(g), NodeId)> ordenado por f=g+h con desempate (g, id) — con h≡0 la clave degenera en la de Dijkstra; RE-APERTURA de nodos (no hay settled: entradas obsoletas detectadas por g_entrada > g[v]) para seguir óptimo con heurísticas admisibles-INCONSISTENTES al precio de re-expandir; parada al primer pop VIVO del destino (argumento de admisibilidad: todo camino por descubrir cuesta ≥ el f mínimo del heap); h revisada finita y ≥0 en cada estimación CACHEADA ≤1 vez/nodo (NaN haría panic en Cost::cmp → NonFiniteHeuristic; negativa rompe el criterio de parada → NegativeHeuristic); f puede desbordar a ∞ (sólo prioridad) pero g se valida (CostOverflow). DECISIÓN HONESTA de validación: admisibilidad NO verificable eager (exigiría el coste real = resolver Dijkstra) → documentada + riesgo DEMOSTRADO (h sobre-estimada y unidades km/min mezcladas ⇒ camino subóptimo EN SILENCIO, testeado); consistencia sí es local O(E) → utilidad check_consistency(store, weight, &dyn Heuristic) -> Result<(), PathError> (InconsistentHeuristic{edge,h_from,bound}) como diagnóstico, PERO a_star NO la exige (rechazarla sería rechazar respuestas correctas). PathStats EXTENDIDO con campo expanded (pops vivos; también incrementado por dijkstra del cap 22) para MEDIR el ahorro Dijkstra vs A*. PathError extendido a 12 variantes (5 nuevas cap 23). Sin variante single-source (el sesgo es la gracia; distancias intermedias no garantizadas). Sin crates externas (hypot de std). 14 tests (tests_a_estrella) + 4 doctests: h≡0 == Dijkstra exacto (coste+camino+pops+expanded+updates), inalcanzable None y origen=destino trivia, euclídea mismo coste con MENOS expansiones (trampa de aristas 0.5 que se aleja: Dijkstra 13 expandidos vs A* 10), HITO del brief red de ciudades 7 españolas con coords km y carreteras ≥ recta (Madrid→Barcelona via Zaragoza 440 vs directo 460; 7 vs 3 expansiones; check_consistency Ok), unidades mezcladas km-vs-minutos (subóptimo 200 vs 165 en silencio + InconsistentHeuristic señala la arista), admisible-no-consistente (re-expansión MEDIDA: 5 expansiones para 4 nodos, aun así coste == Dijkstra), sobre-estimación deliberada (3.0 vs 2.0, camino válido pero subóptimo), herencia cap22 (MissingWeight/InvalidWeight/NegativeWeight eager, UnknownNode, CostOverflow, multigrafos/self-loops/Constant), coordenadas (ausente/NULL/String/NaN/Int-promociona, destino eager vs resto on-demand), heurística negativa y NaN rechazadas, Display+std::error de las 5 variantes nuevas, stats coherentes + Display Cypher heredado."
