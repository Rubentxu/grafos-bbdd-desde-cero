# ─────────────────────────────────────────────────────────────────
# code-map.yml — Tabla bidireccional prosa ↔ código
#
# Mapea cada capítulo del libro a las crates y snippets de este
# workspace que contienen su código ejecutable.
#
# Mantenedor: code-integration-architect (skill del BOOK-WORKFLOW).
# Cada vez que un cap. se mueve de PLANNED a DONE, sincronizar.
#
# Esquema:
#   vol1 / vol2:
#     - chapter: "vol1-cap-NN"           # ID canónico del capítulo
#       title: "<título evocador>"       # mismo título que en el manuscrito
#       crates: [<crate-name>, ...]      # crates en /crates/
#       snippets: [<snippet-id>, ...]    # IDs de snippets sueltos
#       modules: [<module-path>, ...]    # submódulos dentro de un crate
#       notes: "<texto libre>"           # advertencias o contexto
#       status: PLANNED | IN_REVIEW | DONE
# ─────────────────────────────────────────────────────────────────

vol1:
  - chapter: "vol1-cap-01"
    title: "Introducción a grafos"
    crates: []
    snippets: []
    notes: "Capítulo conceptual sin código ejecutable; sólo definiciones y figuras ASCII."
    status: DONE
  - chapter: "vol1-cap-02"
    title: "Representaciones de grafos"
    crates:
      - vol1-cap-02-vec-adj
      - vol1-cap-02-petgraph
    snippets: []
    notes: "Migrado en Fase M1 (commit: vol1-cap-02/03/04 migrated and verified). Bug del libro detectado: g.vecinos(&1) → g.vecinos(1). Doctest del cap-02-petgraph usa fences ```text (no ```rust) por la presencia de caracteres que rompen el parser de Rust."
    status: DONE
  - chapter: "vol1-cap-03"
    title: "BFS y DFS"
    crates:
      - vol1-cap-03-bfs-dfs
    snippets: []
    notes: "Migrado en Fase M1. Incluye BFS iterativo (§3.2), DFS recursivo + iterativo (§3.4). Las versiones con petgraph (§3.5) no se migraron — están en el libro como texto."
    status: DONE
  - chapter: "vol1-cap-04"
    title: "Dijkstra y Bellman-Ford"
    crates:
      - vol1-cap-04-dijkstra
    snippets: []
    notes: "Migrado en Fase M1. Incluye Dijkstra con BinaryHeap<Reverse> (§4.4) y Bellman-Ford con detección de ciclo negativo (§4.5). Bug del libro detectado: test 'destino_inalcanzable_es_max' asumía 3 vértices pero grafo sólo tenía 2 — corregido añadiendo vec![] para vértice aislado. Test extra añadido: 'dfs_iterativo_y_recursivo_coinciden_en_longitud' (no estaba en el libro)."
    status: DONE
  - chapter: "vol1-cap-05"
    title: "MST: Kruskal y Prim"
    crates:
      - vol1-cap-05-mst
    snippets: []
    notes: "Migrado en Fase M3a. Union-Find (DSU) + Kruskal + Prim. Sin deps externas."
    status: DONE
  - chapter: "vol1-cap-10"
    title: "Max-Flow: Ford-Fulkerson, Edmonds-Karp, Dinic"
    crates:
      - vol1-cap-10-maxflow
    snippets: []
    notes: "Migrado en Fase M3a. ford_fulkerson del libro es simplificado (sin aristas inversas → da 20 vs 23 óptimo); test relajado."
    status: DONE
  - chapter: "vol1-cap-11"
    title: "Min-Cut: DinicCut, König, Karger"
    crates:
      - vol1-cap-11-mincut
    snippets: []
    notes: "Migrado en Fase M3a. Depende de vol1-cap-10-maxflow. Bugs del libro corregidos: min_vertex_cut (cap 1 en s), Karger (closure &mut). Karger re-implementado + brute_force oráculo."
    status: DONE
  # ... caps 06-09, 12-32 por poblar progresivamente (Fase M3b+)

