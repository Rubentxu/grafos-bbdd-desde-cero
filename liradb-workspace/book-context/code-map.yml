    snippets: []
    notes: "Abre la Parte V (algoritmos sobre el grafo persistente). El Vol.I (caps 4 y 9) ya enseñó Dijkstra/Bellman-Ford algorítmicamente; aquí se ejecutan SOBRE el grafo del store con pesos leídos de PROPIEDADES de arista (la consulta del brief: SHORTEST PATH FROM node:1 TO node:42 WEIGHT relationship.distance). WeightSource (Property configurable o Constant; Default=1.0 para contar saltos) + edge_weight con semántica estricta tipada: prop ausente o NULL = MissingWeight, tipo no numérico = InvalidWeight (con type_name), NaN/±∞ = NonFiniteWeight, Int se promociona a Float (pérdida >2^53 documentada y testeada). DECISIÓN: algoritmos sobre &dyn GraphStore (no CSR) — los pesos viven en Edge.props y el CSR del cap 14 sólo persiste topología sin ids de arista; la proyección con pesos es cap 26. El CSR participa como oráculo de consistencia en un test (alcanzabilidad BFS sobre la proyección == reached() de Dijkstra). Dijkstra: BinaryHeap<Reverse<(Cost, NodeId)>> de std (Cost = f64 con Ord total, invariantes documentadas), borrado perezoso con settled, predecesores como PathStep (arista+peso, reconstrucción sin re-tocar el store), FINALIZACIÓN ANTICIPATA al destino (invariante codicioso), y sanidad eager O(E) que rechaza pesos negativos ANTES de correr (NegativeWeight) — una BD prefiere fallar ruidosamente a contestar casi-bien. Bellman-Ford: lista de relajación materializada una vez, V-1 pasadas con parada temprana, pasada de verificación → ciclo negativo ALCANZABLE desde origen = NegativeCycle (el inalcanzable no contamina); SIN early-exit por destino (nada lo justifica sin invariante codicioso). Misma interfaz ambos: ShortestPaths (dist+pred+PathStats) y Path (steps con edge/from/to/weight, nodes(), hops(), coste, Display estilo Cypher) + variantes _path punto-a-punto. PathError tipado (7 variantes; 12 desde que el cap 23 añadió las de heurísticas) con Display+Error. CostOverflow si una suma desborda (para no confundir infinito real con el centinela de inalcanzable). 30 tests (tests_caminos) + 3 doctests: pesos (ausente/NULL/invalid/no-finito/promoción Int), Dijkstra (diamante del cap 4 Vol.I, menos saltos ≠ más barato, la fuente de pesos cambia la respuesta, multigrafo paralelo, inalcanzable=Ok(None), origen=destino, self-loops, huecos tras delete_node, negativos rechazados aun inalcanzables, overflow, early-exit medido en pops, tabla completa), Bellman-Ford (== Dijkstra sin negativos, negativo que Dijkstra no puede, ciclo negativo alcanzable/inalcanzable/self-loop, parada temprana en rounds, pesos estrictos), integración (oráculo CSR, demo_graph con since→MissingWeight como lección de calidad de dato, Display)."
