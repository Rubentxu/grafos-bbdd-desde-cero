    snippets: []
    notes: "Convierte el AST de los caps 17-18 (Query) en un ÁRBOL DE OPERADORES LÓGICOS (el 'qué' calcular, sin el 'cómo': la ejecución Volcano es cap 20 y la optimización cap 21). Pipeline: parse() → lower() → LogicalPlan. Tipos nuevos: (1) LogicalType (Any/Null/Bool/Int/Float/String/Bytes/Node/Edge) con eq_compatible/order_compatible para la 'inferencia de tipos básica' del brief — conservadora porque LiraDB es schemaless (propiedades tipan Any, comparaciones se resuelven en ejecución). (2) Bindings { entries: Vec<(String, BindingKind)> } — la tabla de variables ligadas (BindingKind Node/Edge) que responde la pregunta crítica del CORPUS 'cómo representar variables ligadas': orden de declaración determinista (Vec, no HashMap), declare() rechaza duplicados. (3) ScalarExpr — el Expression del AST RESUELTO: sin Span (errores usan el span de la cláusula originaria), Variable→Var{name, kind} con BindingKind incrustado, + HasLabel{variable,label} nuevo (predicado de etiqueta que el planner construye; no existe como expresión sintáctica) con type_of() → Result<LogicalType, PlanErrorKind> (comparaciones eq numéricas cruzadas+wildcards, orden sólo numérico/string, AND/OR/NOT exigen Bool-o-Any, WHERE raíz Bool) y Display con paréntesis mínimos por precedencia NOT>AND>OR. (4) LogicalPlan — enum con NodeScan{variable,label} (hoja; label None = ANY), Expand{input,from,rel_variable,rel_type,direction,to} (encadena tramos), Filter{input,predicate} (WHERE + predicados inline conjuntados con and_all: SIN push-down, ése es el 'antes' del optimizador cap 21), Project{input,items} (raíz, Vec<Projection{expr,alias}> con output_name() derivado var/var.prop/canónico), CartesianProduct{left,right} (patrones MATCH separados por coma DISJUNTOS); bound_variables() en orden de ligadura (material para el push-down del cap 21). (5) PlanError{kind,span} con PlanErrorKind (EmptyMatch/EmptyReturn/UnknownVariable/DuplicateVariable/VariableRebind —re-ligar dentro del mismo patrón, el re-binding es del executor—/SharedPatternVariables —join entre patrones, cap 21—/TypeMismatch{context,expected,got}), Display con sufijo de span, impl std::error::Error. (6) Planner (privado) con lower_path (NodeScan + Expand* por camino; nodo anónimo → variable interna _n1/_e1 sin colisión con usuarios; label del nodo inicial alimenta el NodeScan, el de los nodos de la cadena baja como HasLabel al Filter; props inline bajan como igualdades) y build_scalar (resuelve nombres contra Bindings). API pública: lower(&Query) → Result<LogicalPlan,PlanError> + Query::lower(). Bug del brief corregido: su plan de ejemplo omitía imponer f:Person del patrón (habría devuelto conocidos de cualquier etiqueta); aquí baja como predicado HasLabel en el Filter — documentado en el banner del cap y en el test lower_display_ejemplo_canonico_del_brief. Display de LogicalPlan = pretty-printer indentado 2 espacios por nivel (formato del brief: 'Project(f.name) / Filter(...) / Expand(p, KNOWS, OUTGOING, f) / NodeScan(Person AS p)'), base directa de liradb explain (cap 21). Límites declarados: sin re-binding de variables en un patrón, sin join entre patrones que comparten variables, Filter sin push-down (todo cap 21). Sin crates externas. 40 tests propios (tests_logical_plan): LogicalType display/eq_compatible/order_compatible, Bindings declara/itera/duplicados, ScalarExpr display sin paréntesis redundantes + mínimos por precedencia/and_all left-asociativo/type_of literales+vars+props+comparaciones+lógicos, lowering base (MATCH nodo solo/ejemplo canónico del brief en texto y estructura/anónimo→_n1/sin label→ANY/props inline→Filter/WHERE+inline conjuntados/path 3 nodos encadena Expands/direcciones IN y UNDIRECTED/relación con variable y sin tipo→ANY/patrones disjuntos→CartesianProduct/RETURN alias y nombres derivados), errores semánticos (WHERE var no ligada con span del acceso/RETURN desconocido/prop inline desconocida/re-ligar variable/patrones comparten variables→join/MATCH y RETURN vacíos vía AST a mano), type-check (WHERE no bool/igualdad imposible NODE vs BOOL/orden imposible Bool/p.esquemaless pasa/WHERE TRUE y AND sobre Int/NOT sobre Int/RETURN item type-checkeado), integración (parse→lower pipeline completo = método y función/libre coinciden/display estable y idempotente/error Display localiza y es std::error::Error/shared variables Display/dos anónimos no colisionan)."
