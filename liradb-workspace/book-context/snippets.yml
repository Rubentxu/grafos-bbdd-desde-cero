# ─────────────────────────────────────────────────────────────────
# snippets.yml — Inventario de snippets sueltos (archivos .rs standalone)
#
# Un snippet es un archivo Rust ejecutable que NO vive dentro de una
# crate (no tiene Cargo.toml). Se usa para ejemplos cortos que no
# ameritan una crate entera: una función, un test aislado, un
# algoritmo de 20 líneas.
#
# Convención de nombre: snippets/vol<vol>-cap-<NN>-<slug>.rs
#
# Esquema:
#   - id: <string único>                # snack_case
#     path: <relativo a la raíz>
#     chapter_origin: "vol<N>-cap-<NN>" # capítulo del que proviene
#     description: "<texto corto>"
#     has_main: <bool>                  # ¿tiene fn main()?
#     has_tests: <bool>                 # ¿tiene #[test]?
#     standalone: <bool>                # ¿corre con rustc directo o necesita crate?
# ─────────────────────────────────────────────────────────────────

snippets: []

