[package]
# El PACKAGE se llama `liradb-cli` (siguiendo el prefijo del directorio
# `crates/vol2-liradb-cli/`), pero el BINARIO se llama `liradb` (ver
# [[bin]] abajo): la orden del usuario es `liradb demo` / `liradb query`,
# no `liradb-cli demo`. Documentado en MIGRATION-PATTERN §25 y §36.
name = "liradb-cli"
version = "0.1.0"
edition = "2024"
description = "Vol.II — Cap. 31: LA CLI de LiraDB (abre la Parte VII). clap (Builder API) con subcomandos demo/query/explain/repl/script, flags --graph/--plan/--stats y --version; REPL interactivo con sesión persistente y meta-comandos (:node/:edge/:del-*, :demo/:clear/:graph, y :begin/:commit/:rollback — la Transaccion del cap. 27 hecha producto: mientras vive, prompt tx> y las consultas esperan porque el store está prestado); script mode (fichero o stdin '-') con el MISMO intérprete, comentarios y parada en el primer error con nº de línea; testable sin procesos vía run_con_entrada(args, &mut dyn Read, out, err) -> i32. El hito CLI mínima (demo/query/help con parseo manual) queda como comportamiento por defecto conservado. Import/export (CSV/JSONL/GraphML) es el cap. 32."
license = "CC-BY-NC-SA-4.0"
authors = ["Rubentxu"]
publish = false

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
# LA primera crate externa de la CLI: el pago de la regla del Vol.II
# «primero a mano, luego con crates» — el hito parseó argv a mano y este
# capítulo migra a clap (Builder API, explícita; la prosa contrasta con
# #[derive(Parser)]). Versión mínima declarada; el pineo EXACTO lo hace
# el Cargo.lock commiteado (política §5 de MIGRATION-PATTERN).
clap = "4.5"
# Dependencia interna por path (política §5 de MIGRATION-PATTERN: sólo lo
# necesario, pineado; aquí una crate del propio workspace, sin versión).
vol2-liradb = { path = "../vol2-liradb" }

[[bin]]
# La orden de usuario es `liradb`, no `liradb-cli`.
name = "liradb"
path = "src/main.rs"

[dev-dependencies]
# Para el test de `liradb script <fichero>` (directorio temporal).
tempfile = "3.10"
