[package]
name = "vol1-cap-20-gnn"
version = "0.1.0"
edition = "2024"
description = "Vol.I Cap.20 — Mini-GCN (Graph Convolutional Network) con ndarray"
license = "CC-BY-NC-SA-4.0"
authors = ["Rubentxu"]
publish = false

[lib]
path = "src/lib.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
ndarray = "0.15"
ndarray-rand = "0.14"
# rand 0.8 (versión del Vol.I). ndarray-rand 0.14 está pineado a esta versión.
# Aplica a este crate únicamente: rand 0.8 no se puede usar en otros crates
# porque Rust 2024 reserva la keyword `gen` que rand 0.8 usa para `rng.gen::<T>()`.
# Aquí evitamos el problema: cap-20-gnn no llama `rng.gen()` directamente;
# delega en ndarray-rand.
rand = "0.8"