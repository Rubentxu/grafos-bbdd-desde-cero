[package]
name = "vol2-liradb"
version = "0.1.0"
edition = "2024"
description = "Vol.II Caps 7-27 — LiraDB: Property Graph + GraphStore + encoding + append-only + páginas + Pager/FilePager + BufferPool (Clock/LRU) + CSR persistente + HashIndex + B+ tree + mantenimiento (inspect|check|compact) + lenguaje LiraQL (AST cap 17 + lexer y parser cap 18 + plan lógico cap 19 + motor de ejecución Volcano cap 20 + optimizador por reglas con estadísticas y explain cap 21) + caminos mínimos ponderados sobre el grafo persistente (pesos desde props, Dijkstra con finalización anticipada y Bellman-Ford con detección de ciclos negativos, cap 22) + A* con heurísticas definidas por el usuario (trait Heuristic, euclídea por coordenadas de nodo, admisibilidad documentada y consistencia diagnosticable, cap 23) + centralidad y PageRank (grado/closeness Wasserman-Faust/betweenness Brandes/eigenvector sobre proyección del store, PageRank con damping y convergencia L1, personalizado con teleport de semillas para GraphRAG, cap 24) + comunidades y agrupaciones (componentes conexas, label propagation determinista, modularidad Q_γ verificable sobre particiones dadas y Louvain simplificado con fase greedy + agregación jerárquica cuya jerarquía de niveles alimentará GraphRAG, cap 25) + transacciones: vocabulario ACID tipado con informe honesto del estado actual (A parcial por staging, C trivial, I por préstamo exclusivo, D ninguna sin WAL) y Transaccion por staging con begin/commit/rollback, atomicidad naive o-todas-o-ninguna frente a errores de validación, autocommit y anomalías de aislamiento como vocabulario, con los límites demostrados en tests como gancho al WAL (cap 27, abre la Parte VI — fiabilidad)"
license = "CC-BY-NC-SA-4.0"
authors = ["Rubentxu"]
publish = false

[lib]
path = "src/lib.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]

[dev-dependencies]
# Para tests de FilePager (cap 12): directorios temporales.
# Pinned sin ^ ni ~ por la política de reproducibilidad del workspace.
tempfile = "3.10"