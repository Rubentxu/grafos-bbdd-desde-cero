[package]
name = "vol2-liradb"
version = "0.1.0"
edition = "2024"
description = "Vol.II Caps 7-30 — LiraDB: Property Graph + GraphStore + encoding + append-only + páginas + Pager/FilePager + BufferPool (Clock/LRU) + CSR persistente + HashIndex + B+ tree + mantenimiento (inspect|check|compact) + lenguaje LiraQL (AST cap 17 + lexer y parser cap 18 + plan lógico cap 19 + motor de ejecución Volcano cap 20 + optimizador por reglas con estadísticas y explain cap 21) + caminos mínimos ponderados sobre el grafo persistente (pesos desde props, Dijkstra con finalización anticipada y Bellman-Ford con detección de ciclos negativos, cap 22) + A* con heurísticas definidas por el usuario (trait Heuristic, euclídea por coordenadas de nodo, admisibilidad documentada y consistencia diagnosticable, cap 23) + centralidad y PageRank (grado/closeness Wasserman-Faust/betweenness Brandes/eigenvector sobre proyección del store, PageRank con damping y convergencia L1, personalizado con teleport de semillas para GraphRAG, cap 24) + comunidades y agrupaciones (componentes conexas, label propagation determinista, modularidad Q_γ verificable sobre particiones dadas y Louvain simplificado con fase greedy + agregación jerárquica cuya jerarquía de niveles alimentará GraphRAG, cap 25) + transacciones: vocabulario ACID tipado con informe honesto del estado actual (A parcial por staging, C trivial, I por préstamo exclusivo, D ninguna sin WAL) y Transaccion por staging con begin/commit/rollback, atomicidad naive o-todas-o-ninguna frente a errores de validación, autocommit y anomalías de aislamiento como vocabulario, con los límites demostrados en tests como gancho al WAL (cap 27, abre la Parte VI — fiabilidad) + write-ahead log: WalRecord con LSN u64 monótono y TxId (Begin/Operacion/Commit/Rollback — reutiliza la Operacion del cap 27 bajo el framing+CRC32 del cap 10), WalTransaccion con commit en dos fases (log write-ahead + registro Commit + sync ANTES del apply: un apply a medias se completa por replay — roll-forward, el test-tesis que invierte la regresión del cap 27), replay_wal redo idempotente de lo confirmado en orden de LSN con parada limpia ante CRC/cola truncada, truncado con contrato firmado por el llamador, política de flush por escritura o por commit (semilla del group commit) y re-valoración honesta de ACID tras el WAL (D: ninguna→parcial; cap 28) + recuperación después de un fallo (ARIES simplificado Analysis-Redo-Undo: analizar reconstruye la tabla de transacciones ganadoras/perdedoras, los contadores next_lsn/next_tx_id y la dirty element table; redo re-aplica todas las operaciones idempotente; deshacer revierte en orden inverso las perdedoras con imágenes anteriores AntesImagenes — el test-tesis del steal demuestra el undo y el borrado robado sin before-image se reporta; guardar_wal/cargar_wal ponen el log en fichero y reabrir ejecuta el arranque completo; Checkpoint/truncar_seguro/rotar_si_excede automatizan el truncado y la rotación por tamaño; cap 29) + snapshots y concurrencia (MVCC limitado: MvccStore con cadenas de versiones ts_begin/ts_end por elemento — lecturas por snapshot que NO bloquean al escritor (&self + clonar, sin locks), commit que asigna un ts y retira+appendiza versiones con gc(hasta) por timestamp lógico, NivelAislamiento que conecta con el Anomalia del cap 27 (Instantanea prohíbe lectura sucia y actualización perdida; write skew queda como frontera hacia Serializable SI con predicate locks) y GrafoEspera para detección O(V+E) de ciclos de deadlock por DFS con colores; cap 30 — CIERRA la Parte VI)"
license = "CC-BY-NC-SA-4.0"
authors = ["Rubentxu"]
publish = false

[lib]
path = "src/lib.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]

[dev-dependencies]
# Para tests de FilePager (cap 12): directorios temporales.
# Pinned sin ^ ni ~ por la política de reproducibilidad del workspace.
tempfile = "3.10"