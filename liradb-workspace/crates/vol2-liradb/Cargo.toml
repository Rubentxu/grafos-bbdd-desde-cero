[package]
name = "vol2-liradb"
version = "0.1.0"
edition = "2024"
description = "Vol.II Caps 7-23 — LiraDB: Property Graph + GraphStore + encoding + append-only + páginas + Pager/FilePager + BufferPool (Clock/LRU) + CSR persistente + HashIndex + B+ tree + mantenimiento (inspect|check|compact) + lenguaje LiraQL (AST cap 17 + lexer y parser cap 18 + plan lógico cap 19 + motor de ejecución Volcano cap 20 + optimizador por reglas con estadísticas y explain cap 21) + caminos mínimos ponderados sobre el grafo persistente (pesos desde props, Dijkstra con finalización anticipada y Bellman-Ford con detección de ciclos negativos, cap 22) + A* con heurísticas definidas por el usuario (trait Heuristic, euclídea por coordenadas de nodo, admisibilidad documentada y consistencia diagnosticable, cap 23)"
license = "CC-BY-NC-SA-4.0"
authors = ["Rubentxu"]
publish = false

[lib]
path = "src/lib.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]

[dev-dependencies]
# Para tests de FilePager (cap 12): directorios temporales.
# Pinned sin ^ ni ~ por la política de reproducibilidad del workspace.
tempfile = "3.10"