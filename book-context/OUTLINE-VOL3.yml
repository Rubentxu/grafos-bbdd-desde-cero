      Dependencias respetadas: lpg-modeling (41) antes que antipatrones/temporalidad/esquema (42-44);
      esquema+ingesta (44-45) antes que LLM-extraction (52); rdf-model (46) antes que ontologías y
      lenguajes (47-48); graph-embeddings (49) antes que HNSW (50) y GraphRAG (51);
      graphrag+llm-extraction+temporalidad antes que agent-memory (53). Externos del Vol.II
      consolidados, no re-enseñados.
  - regla: "ninguna parte vacía ni capítulo sin secciones"
    estado: OK
  - regla: "carga cognitiva ≤3 conceptos nuevos por capítulo"
    estado: OK
    notas: "Máximo: cap. 51 con 3 (hybrid-retrieval, personalized-pagerank, graphrag) — justificado porque PPR ya se consolidó en Vol.II cap. 24."
  - regla: "distribución de páginas razonable"
    estado: OK
    notas: "Media ~22,7 págs.; max 26 (caps. 50-51) < 150% de la media."

